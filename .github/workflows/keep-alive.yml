name: Keep backend awake

# Render's free tier sleeps a service after ~15 min of inactivity, which
# causes a ~50s cold start on the next request. Pinging /health every 10 min
# keeps the backend warm so the AI chatbot and planner respond instantly.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 90 https://nomadiq-backend-91tl.onrender.com/health \
            || echo "ping failed — will retry on the next scheduled run"
